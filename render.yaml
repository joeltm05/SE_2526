# Render Blueprint: backend (Node) + frontend (Static via Vite) + Postgres

services:
  # Backend API service
  - type: web
    name: SE_2526_backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: SE_2526_db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*" # later, replace with frontend URL

  # Frontend (Static Vite site)
  - type: web
    name: SE_2526_frontend
    env: static
    plan: free
    rootDir: web
    buildCommand: npm_config_production=false npm ci && npx vite build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "" # set to backend URL after first deploy

# Database
databases:
  - name: SE_2526_db
    plan: free
