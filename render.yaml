# Render Blueprint: backend (Node) + frontend (Static via Vite) using Railway Postgres

services:
  # Backend API service
  - type: web
    name: SE_2526_backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        value: "postgresql://postgres:WghqLMzKaUZyhkFSJebxpDHVVRrDlyjZ@centerbeam.proxy.rlwy.net:32644/railway"
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*" # replace with frontend URL after first deploy
      - key: JWT_SECRET
        value: dev-local-secret # or use generateValue: true for a random one

  # Frontend (Static Vite site)
  - type: web
    name: SE_2526_frontend
    env: static
    rootDir: web
    buildCommand: npm_config_production=false npm ci && npx vite build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "" # fill this with backend URL after deploy
